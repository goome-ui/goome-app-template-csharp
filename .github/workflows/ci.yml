name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOOME_BACKEND: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: build
        run: dotnet build -c Release
      - name: run on the test backend
        run: |
          mkdir -p shots
          out=$(GOOME_TEST_SHOTS=shots GOOME_TEST_SCRIPT="screen 1280x720 1; 3 click 60,28; end 6" dotnet run -c Release --no-build)
          echo "$out"
          ls shots | grep -q ppm
          if [ -d variants ]; then echo "$out" | grep -q "overlay mode"; fi
      - name: other templates
        if: hashFiles('variants/**') != ''
        run: |
          for v in variants/*/; do
            n=$(basename "$v")
            d="$RUNNER_TEMP/v/$n"
            mkdir -p "$d" "shots-$n"
            cp *.csproj "$d/"
            cp "$v/Program.cs" "$d/"
            dotnet build -c Release "$d"
            GOOME_TEST_SHOTS="$PWD/shots-$n" GOOME_TEST_SCRIPT="screen 1280x720 1; 2 hotkey alt+m; 3 click 100,140; end 6" dotnet run -c Release --no-build --project "$d"
            ls "shots-$n" | grep -q ppm
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ runner.os }}
          path: shots*/
          if-no-files-found: ignore
